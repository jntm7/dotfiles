[terminal.shell]
program = "pwsh"
args = [ "-NoLogo", "-WorkingDirectory", "~" ]

[font]
size = 12

  [font.normal]
  family = "MesloLGM Nerd Font"

  [font.offset]
  x = 0
  y = 4

[window]
opacity = 0.75

  [window.dimensions]
  columns = 120
  lines = 30

[general]
import = ["~/AppData/Roaming/alacritty/themes/tokyonight_night.toml"]
