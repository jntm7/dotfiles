# kitty.conf
# Migrated from alacritty.toml (Nord theme)

# =============================================================================
# Shell & Environment
# =============================================================================
shell /usr/bin/zsh
term xterm-256color

# =============================================================================
# Window
# =============================================================================
initial_window_width  100c
initial_window_height 30c
background_opacity    0.8
dynamic_background_opacity no
hide_window_decorations no
title_bar_color       dark
window_title          kitty@CachyOS

dynamic_padding       yes
window_padding_width  4

# =============================================================================
# Scrollback
# =============================================================================
scrollback_lines      10000
wheel_scroll_multiplier 3.0

# =============================================================================
# Font
# =============================================================================
font_family           JetBrainsMono Nerd Font Regular
bold_font             auto
italic_font           auto
bold_italic_font      auto
font_size             12.0

adjust_line_height    0
adjust_column_width   0

# =============================================================================
# Cursor
# =============================================================================
cursor_shape          underline
cursor_underline_thickness 0.15
cursor_blink_interval 0
cursor_stop_blinking_after 0

# =============================================================================
# Mouse
# =============================================================================
mouse_hide_wait       3.0
copy_on_select        yes
paste_actions         quote-urls-at-prompt

# =============================================================================
# Colors (Nord)
# =============================================================================
background            #2E3440
foreground            #D8DEE9

# Normal colors
color0                #3B4252
color1                #BF616A
color2                #A3BE8C
color3                #EBCB8B
color4                #81A1C1
color5                #B48EAD
color6                #88C0D0
color7                #E5E9F0

# Bright colors
color8                #4C566A
color9                #BF616A
color10               #A3BE8C
color11               #EBCB8B
color12               #81A1C1
color13               #B48EAD
color14               #8FBCBB
color15               #ECEFF4

draw_minimal_borders  yes

# =============================================================================
# Keyboard shortcuts
# =============================================================================

# Clear defaults and set our own
clear_all_shortcuts   no

# Copy / Paste
map ctrl+shift+c      copy_to_clipboard
map ctrl+shift+v      paste_from_clipboard
map shift+insert      paste_from_selection

# Scrolling
map shift+page_up     scroll_page_up
map shift+page_down   scroll_page_down
map shift+home        scroll_home
map shift+end         scroll_end

# Font size
map ctrl+0            change_font_size all 0

# Search (kitty uses a different mechanism — open scrollback in less/vim)
map ctrl+shift+f      show_scrollback

# =============================================================================
# Misc
# =============================================================================
enable_audio_bell     no
visual_bell_duration  0.0
confirm_os_window_close 0
